    <style>
        /* ============================================
           🎨 RESET & BASE
           ============================================ */
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;font-family:'Cairo',Arial,sans-serif;overflow-x:hidden}

        :root{
            --accent:#19aaff;
            --accent-dark:#087cff;
            --accent-glow:#19aaff88;
            --bg-dark:#020812;
            --bg-card:rgba(7,19,33,.85);
            --text-primary:#fff;
            --text-secondary:#c0d0e0;
            --text-muted:#60788c;
            --border-color:#19aaff33;
            --danger:#ff3344;
            --success:#25D366;
            --gold:#ffd700;
            --transition:0.35s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        body{
            background:var(--bg-dark);
            color:var(--text-primary);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
        }

        /* ============================================
           🌌 ANIMATED BACKGROUND
           ============================================ */
        .bg-layer{
            position:fixed;inset:0;z-index:0;
            background:
                radial-gradient(circle at 20% 20%, #19aaff11, transparent 50%),
                radial-gradient(circle at 80% 80%, #087cff11, transparent 50%),
                radial-gradient(circle at 50% 50%, #19aaff08, transparent 70%),
                var(--bg-dark);
        }

        /* Matrix rain */
        #matrixCanvas{
            position:fixed;inset:0;z-index:1;
            opacity:.18;
            pointer-events:none;
        }

        /* Floating particles */
        .particles{
            position:fixed;inset:0;z-index:1;
            pointer-events:none;overflow:hidden;
        }
        .particle{
            position:absolute;
            width:3px;height:3px;
            background:var(--accent);
            border-radius:50%;
            box-shadow:0 0 10px var(--accent);
            animation:particleFloat linear infinite;
            opacity:.6;
        }
        @keyframes particleFloat{
            0%{transform:translateY(100vh) scale(0);opacity:0}
            10%{opacity:.6}
            90%{opacity:.6}
            100%{transform:translateY(-10vh) scale(1.2);opacity:0}
        }

        /* ============================================
           🖼️ MAIN LAYOUT
           ============================================ */
        .login-wrapper{
            position:relative;z-index:10;
            width:min(1100px,95%);
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:40px;
            align-items:center;
            padding:20px;
        }

        /* ============================================
           🖼️ IMAGE SIDE (Desktop only)
           ============================================ */
        .image-side{
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            animation:floatIn .8s ease-out;
        }
        .image-side::before{
            content:'';
            position:absolute;
            width:80%;height:80%;
            background:radial-gradient(circle, #19aaff44, transparent 70%);
            filter:blur(60px);
            z-index:-1;
            animation:pulseGlow 4s ease-in-out infinite;
        }
        @keyframes pulseGlow{
            0%,100%{opacity:.5;transform:scale(1)}
            50%{opacity:.9;transform:scale(1.1)}
        }
        .image-side img{
            width:100%;
            max-width:480px;
            height:auto;
            filter:drop-shadow(0 20px 60px #19aaff55);
            animation:imageFloat 5s ease-in-out infinite;
        }
        @keyframes imageFloat{
            0%,100%{transform:translateY(0) rotate(0deg)}
            50%{transform:translateY(-15px) rotate(1deg)}
        }
        @keyframes floatIn{
            from{opacity:0;transform:translateX(-40px)}
            to{opacity:1;transform:translateX(0)}
        }

        /* ============================================
           🎴 LOGIN CARD
           ============================================ */
        .login-card{
            background:var(--bg-card);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--border-color);
            border-radius:24px;
            padding:32px 28px;
            box-shadow:
                0 30px 80px rgba(0,0,0,.5),
                0 0 60px #19aaff22,
                inset 0 1px 0 #ffffff11;
            position:relative;
            overflow:hidden;
            animation:floatIn .8s ease-out;
            max-height:92vh;
            overflow-y:auto;
        }

        /* top glow line */
        .login-card::before{
            content:'';
            position:absolute;
            top:0;left:0;right:0;
            height:2px;
            background:linear-gradient(90deg, transparent, var(--accent), transparent);
            animation:scanLine 3s linear infinite;
        }
        @keyframes scanLine{
            0%{transform:translateX(-100%)}
            100%{transform:translateX(100%)}
        }

        .login-card::-webkit-scrollbar{width:4px}
        .login-card::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px}
        .login-card::-webkit-scrollbar-track{background:transparent}

        /* ============================================
           🛡️ HEADER
           ============================================ */
        .login-header{text-align:center;margin-bottom:24px}
        .login-logo{
            width:72px;height:72px;
            border-radius:50%;
            border:2px solid var(--accent);
            background:rgba(25,170,255,.1);
            margin:0 auto 12px;
            display:flex;align-items:center;justify-content:center;
            font-size:36px;
            box-shadow:0 0 30px var(--accent-glow);
            animation:float 3s ease-in-out infinite;
            position:relative;
        }
        .login-logo::after{
            content:'';
            position:absolute;inset:-6px;
            border-radius:50%;
            border:1px dashed var(--accent);
            opacity:.4;
            animation:spin 12s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

        .login-brand{
            color:var(--accent);
            font-size:13px;font-weight:900;
            letter-spacing:3px;
            margin-bottom:6px;
            text-shadow:0 0 10px var(--accent-glow);
        }
        .login-brand span{color:#fff}

        .login-title{
            color:var(--text-primary);
            font-size:24px;font-weight:900;
            margin-bottom:4px;
        }
        .login-subtitle{
            color:var(--text-muted);
            font-size:12px;
        }

        /* ============================================
           📝 INPUTS
           ============================================ */
        .input-group{
            position:relative;
            margin-bottom:14px;
        }
        .input-group input{
            width:100%;
            padding:14px 46px 14px 18px;
            border:1.5px solid var(--border-color);
            border-radius:14px;
            background:rgba(2,8,18,.6);
            color:var(--text-primary);
            font-size:14px;
            font-family:'Cairo',Arial,sans-serif;
            outline:none;
            transition:all var(--transition);
        }
        .input-group input::placeholder{
            color:var(--text-muted);
            font-weight:400;
        }
        .input-group input:focus{
            border-color:var(--accent);
            background:rgba(2,8,18,.9);
            box-shadow:
                0 0 0 4px #19aaff22,
                0 0 25px #19aaff44;
            transform:translateY(-1px);
        }
        .input-group .input-icon{
            position:absolute;
            left:14px;top:50%;
            transform:translateY(-50%);
            font-size:18px;
            color:var(--text-muted);
            pointer-events:none;
            transition:all var(--transition);
        }
        .input-group input:focus ~ .input-icon{
            color:var(--accent);
            text-shadow:0 0 10px var(--accent-glow);
        }
        .input-group .toggle-pw{
            position:absolute;
            left:14px;top:50%;
            transform:translateY(-50%);
            background:none;border:none;
            color:var(--text-muted);
            font-size:16px;
            cursor:pointer;
            padding:4px;
            transition:all var(--transition);
        }
        .input-group .toggle-pw:hover{color:var(--accent)}
        .input-group input[type="password"] ~ .toggle-pw{display:block}
        .input-group input[type="text"] ~ .toggle-pw{display:block}

           🔘 BUTTONS
           ============================================ */
        .btn{

            border:0;
            border-radius:14px;
            font-family:'Cairo',Arial,sans-serif;
            font-size:15px;

        .btn-primary:active:not(:disabled){transform:translateY(0)}

            border-radius:50%;
            background:rgba(255,255,255,.4);
            transform:scale(0);
            animation:rippleAnim .6s linear;
            pointer-events:none;

            box-shadow:0 8px 30px #25d36655;
            margin-top:8px;

        .btn-success:hover:not(:disabled){
            transform:translateY(-2px);
            box-shadow:0 15px 45px #25d36688;
        }

        .btn-ghost{
            background:transparent;

            border:1.5px solid var(--border-color);
            margin-top:10px;

        .btn-ghost:hover{

            box-shadow:0 0 25px #19aaff33;

           🎯 MESSAGES
           ============================================ */

            text-align:center;
            min-height:20px;
            margin-top:10px;
            font-weight:700;
            border-radius:10px;
            padding:0 8px;
            transition:all var(--transition);
        }
        .msg.error{
            color:var(--danger);
            text-shadow:0 0 10px #ff334466;
            animation:shake .4s;
        }
        .msg.success{
            color:var(--success);
            text-shadow:0 0 10px #25d36666;
        }
        @keyframes shake{
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}

        /* ============================================
           🔗 LINKS
           ============================================ */
        .link-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:14px;
            font-size:12px;
            flex-wrap:wrap;
            gap:8px;
        }
        .link-row a{
            color:var(--accent);
            text-decoration:none;
            font-weight:700;
            cursor:pointer;
            transition:all var(--transition);
            position:relative;
        }
        .link-row a::after{
            content:'';
            position:absolute;
            bottom:-2px;right:0;
            width:0;height:1px;
            background:var(--accent);
            transition:width var(--transition);
        }
        .link-row a:hover::after{width:100%}
        .link-row a:hover{text-shadow:0 0 10px var(--accent-glow)}

        /* ============================================
           📋 REGISTER FORM
           ============================================ */
        .register-form{
            display:none;
            margin-top:18px;
            padding-top:18px;
            border-top:1px dashed var(--border-color);
            animation:slideDown .4s ease-out;

        .register-form.show{display:block}
        @keyframes slideDown{
            from{opacity:0;transform:translateY(-10px)}
            to{opacity:1;transform:translateY(0)}
        }
        .register-form h3{
            color:var(--accent);
            font-size:15px;
            text-align:center;
            margin-bottom:14px;
            text-shadow:0 0 10px var(--accent-glow);
        }

        /* ============================================
           🌐 SOCIAL
           ============================================ */
        .social-section{
            margin-top:20px;
            padding-top:18px;
            border-top:1px solid var(--border-color);
            text-align:center;
        }
        .social-title{
            color:var(--text-muted);
            font-size:11px;
            letter-spacing:2px;
            margin-bottom:12px;
            font-weight:700;
        }
        .social-icons{
            display:flex;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .social-icon{
            width:40px;height:40px;
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            color:#fff;
            text-decoration:none;
            font-size:18px;
            transition:all var(--transition);
            position:relative;
            overflow:hidden;
        }
        .social-icon::before{
            content:'';
            position:absolute;inset:0;
            border-radius:50%;
            padding:2px;
            background:linear-gradient(135deg, var(--accent), transparent);
            -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite:xor;
            mask-composite:exclude;
            opacity:0;
            transition:opacity var(--transition);
        }
        .social-icon:hover{
            transform:translateY(-4px) scale(1.1);
            box-shadow:0 10px 25px #19aaff55;
        }
        .social-icon:hover::before{opacity:1}
        .social-icon.facebook{background:linear-gradient(135deg,#1877f2,#0c5dc7)}
        .social-icon.instagram{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
        .social-icon.tiktok{background:linear-gradient(135deg,#000,#25f4ee,#fe2c55)}
        .social-icon.telegram{background:linear-gradient(135deg,#0088cc,#006699)}

        /* ============================================
           🦶 FOOTER
           ============================================ */
        .footer{
            text-align:center;
            margin-top:16px;
            padding-top:12px;
            border-top:1px solid var(--border-color);
            color:var(--text-muted);
            font-size:10px;
            line-height:1.8;
        }
        .footer a{
            color:var(--accent);
            text-decoration:none;
            font-weight:700;
        }

        /* ============================================
           ⏳ LOADING SPINNER
           ============================================ */
        .spinner{
            width:16px;height:16px;
            border:2px solid #ffffff44;
            border-top-color:#fff;
            border-radius:50%;
            animation:spinAnim .8s linear infinite;
            display:inline-block;
        }
        @keyframes spinAnim{to{transform:rotate(360deg)}}

        /* ============================================
           📱 RESPONSIVE — TABLET
           ============================================ */
        @media (max-width:900px){
            .login-wrapper{
                grid-template-columns:1fr;
                max-width:480px;
                gap:20px;
            }
            .image-side{
                order:-1;
                margin-bottom:-30px;
            }
            .image-side img{max-width:280px}
            .image-side::before{width:100%;height:100%}
        }

        /* ============================================
           📱 RESPONSIVE — MOBILE
           ============================================ */
        @media (max-width:600px){
            body{align-items:flex-start;padding-top:0}
            .login-wrapper{
                width:100%;
                padding:0;
                gap:0;
                max-width:100%;
            }
            .image-side{
                padding:24px 20px 0;
                margin-bottom:-40px;
                position:relative;
                z-index:5;
            }
            .image-side img{
                max-width:200px;
                filter:drop-shadow(0 10px 30px #19aaff88);
            }
            .image-side::before{
                width:200px;height:200px;

            }
            .login-card{
                border-radius:28px 28px 0 0;

            .login-logo{width:60px;height:60px;font-size:30px}
            .login-title{font-size:20px}
            .login-brand{font-size:11px;letter-spacing:2px}
            .input-group input{padding:13px 42px 13px 16px;font-size:14px}
            .btn{padding:13px 18px;font-size:14px}
            .social-icon{width:38px;height:38px;font-size:16px}
        }

        @media (max-width:380px){
            .login-card{padding:24px 16px 20px}
            .image-side img{max-width:160px}
            .login-title{font-size:18px}
        }

        /* ============================================
           🌞 LIGHT MODE (Bonus)
           ============================================ */
        body.light{
            --bg-dark:#f0f4f8;
            --bg-card:rgba(255,255,255,.9);
            --text-primary:#1a1a2e;
            --text-secondary:#444;
            --text-muted:#888;
            --border-color:#087cff33;
        }
        body.light .input-group input{background:#fff;color:#1a1a2e}
    </style>
</head>

function sanitize(input) {
    if (input === null || input === undefined) return '';
    return String(input)
        .replace(/[<>]/g, '')           // منع HTML tags
        .replace(/[\u0000-\u001F]/g, '') // منع control chars
        .trim();
}

// منع SQL Injection patterns (احتياطي — Supabase محمي أصلاً)
function hasSQLInjection(str) {
    const patterns = [
        /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION|SCRIPT)\b)/i,
        /(--|;|\/\*|\*\/|xp_|sp_)/i,
        /('(\s|OR|AND)\s*')/i,
        /(\bOR\b\s+\d+\s*=\s*\d+)/i

}

        const data = JSON.parse(localStorage.getItem(RATE_LIMIT.key) || '{"count":0,"first":0}');
        const now = Date.now();
        if (now - data.first > RATE_LIMIT.windowMs) {
            // reset window
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify({count:0, first:now}));
            return {ok:true, remaining: RATE_LIMIT.maxAttempts};
        }
        if (data.count >= RATE_LIMIT.maxAttempts) {
            const waitSec = Math.ceil((RATE_LIMIT.windowMs - (now - data.first)) / 1000);
            return {ok:false, remaining:0, waitSec};
        }
        return {ok:true, remaining: RATE_LIMIT.maxAttempts - data.count};
    } catch(e) {
        return {ok:true, remaining: RATE_LIMIT.maxAttempts};
    }
}

function recordAttempt() {
    try {
        const data = JSON.parse(localStorage.getItem(RATE_LIMIT.key) || '{"count":0,"first":0}');
        const now = Date.now();
        if (now - data.first > RATE_LIMIT.windowMs) {
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify({count:1, first:now}));
        } else {
            data.count += 1;
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify(data));
        }
    } catch(e) {}
}

function resetRateLimit() {
    try { localStorage.removeItem(RATE_LIMIT.key); } catch(e) {}
}

function showMsg(elementId, text, type = 'error') {

function togglePassword(fieldId = 'password') {
    const input = document.getElementById(fieldId);
    if (!input) return;
    const btn = input.parentElement.querySelector('.toggle-pw');
    if (input.type === 'password') {
        input.type = 'text';
        if (btn) btn.textContent = '🙈';
    } else {
        input.type = 'password';
        if (btn) btn.textContent = '👁️';
    }
}

/* ============================================
   💫 RIPPLE EFFECT
   ============================================ */
function createRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
}

document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('click', createRipple);
});

/* ============================================

async function login(e) {
    if (e) e.preventDefault();

    const uRaw = document.getElementById('username').value;
    const pRaw = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    clearMsg('loginMsg');

    // Validation
    if (!uRaw || !pRaw) {
        showMsg('loginMsg', '⚠️ اكتب اسم المستخدم وكلمة المرور.', 'error');
        return;
    }

    // Sanitize
    const u = sanitize(uRaw);
    const p = pRaw; // الباسورد مش بنظّفه (ممكن يحتوي رموز)

    if (u.length < 3) {
        showMsg('loginMsg', '⚠️ اسم المستخدم قصير جداً.', 'error');
        return;
    }

    // SQL Injection Check
    if (hasSQLInjection(u)) {
        showMsg('loginMsg', '🚫 محاولة غير مصرح بها.', 'error');
        recordAttempt();
        return;
    }

    // Rate Limit
    const rl = checkRateLimit();
    if (!rl.ok) {
        showMsg('loginMsg', `⏳ محاولات كثيرة. انتظر ${rl.waitSec} ثانية.`, 'error');
        return;
    }

    // UI Loading
    btn.disabled = true;
    btnText.innerHTML = '<span class="spinner"></span> جاري التحقق...';

    try {
        // Supabase Query (Parameterized — آمن من SQL Injection)
        const { data: userData, error } = await sb
            .from('users')
            .select('username, password, role, active, phone')
            .eq('username', u)
            .eq('password', p)
            .maybeSingle();

        if (error) {
            // رسالة عامة (مش بنكشف تفاصيل)
            showMsg('loginMsg', '❌ خطأ في الاتصال. حاول تاني.', 'error');
            recordAttempt();
            return;
        }

        if (!userData) {
            // رسالة عامة (مش بنقول "الباسورد غلط" أو "اليوزر غلط")
            showMsg('loginMsg', '❌ بيانات الدخول غير صحيحة.', 'error');
            recordAttempt();
            return;
        }

        if (userData.active === false) {
            showMsg('loginMsg', '🚫 هذا الحساب معطّل. تواصل مع الدعم.', 'error');
            return;
        }

        // Success — reset rate limit
        resetRateLimit();

        // Save session (بتنظيف)
        const session = {
            username: sanitize(userData.username),
            role: sanitize(userData.role || 'user'),
            active: userData.active !== false,
            phone: sanitize(userData.phone || ''),
            loginAt: Date.now()
        };
        sessionStorage.setItem('sayoda_user', JSON.stringify(session));

        // Update last login (اختياري)
        try {
            await sb.rpc('update_last_login', { p_username: u });
        } catch(e) {}

        showMsg('loginMsg', '✅ تم تسجيل الدخول! جاري التحويل...', 'success');

        // Redirect
        setTimeout(() => {
            if (session.role === 'admin') {
                window.location.href = './admin.html';
            } else {
                window.location.href = './index.html';
            }
        }, 500);

    } catch (err) {
        showMsg('loginMsg', '❌ حدث خطأ غير متوقع.', 'error');
        recordAttempt();
    } finally {
        btn.disabled = false;
        btnText.innerHTML = '🚪 دخول';
    }
}

   ============================================ */
(function matrixRain() {
    const canvas = document.getElementById('matrixCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, columns, drops;
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ01ABCDEF';
    const fontSize = 16;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = Array(columns).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
        ctx.fillStyle = 'rgba(2,8,18,0.08)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#19aaff';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(draw, 50);
})();
