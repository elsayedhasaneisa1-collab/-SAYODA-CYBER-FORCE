<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول | SAYODA | CYBER FORCE</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           🎨 RESET & BASE
           ============================================ */
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;font-family:'Cairo',Arial,sans-serif;overflow-x:hidden}

        :root{
            --accent:#19aaff;
            --accent-dark:#087cff;
            --accent-glow:#19aaff88;
            --bg-dark:#020812;
            --text-primary:#fff;
            --text-secondary:#c0d0e0;
            --text-muted:#8ba0b8;
            --border-color:#19aaff44;
            --danger:#ff3344;
            --success:#25D366;
            --gold:#ffd700;
            --transition:0.35s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        body{
            background:var(--bg-dark);
            color:var(--text-primary);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            overflow:hidden;
            -webkit-user-select:none;
            -moz-user-select:none;
            -ms-user-select:none;
            user-select:none;
        }

        /* ============================================
           🌌 ANIMATED BACKGROUND
           ============================================ */
        .bg-layer{
            position:fixed;inset:0;z-index:0;
            background:
                radial-gradient(circle at 20% 20%, #19aaff11, transparent 50%),
                radial-gradient(circle at 80% 80%, #087cff11, transparent 50%),
                var(--bg-dark);
        }

        #matrixCanvas{
            position:fixed;inset:0;z-index:1;
            opacity:.15;
            pointer-events:none;
        }

        .particles{
            position:fixed;inset:0;z-index:1;
            pointer-events:none;overflow:hidden;
        }
        .particle{
            position:absolute;
            width:3px;height:3px;
            background:var(--accent);
            border-radius:50%;
            box-shadow:0 0 10px var(--accent);
            animation:particleFloat linear infinite;
            opacity:.6;
        }
        @keyframes particleFloat{
            0%{transform:translateY(100vh) scale(0);opacity:0}
            10%{opacity:.6}
            90%{opacity:.6}
            100%{transform:translateY(-10vh) scale(1.2);opacity:0}
        }

        /* ============================================
           🎴 MAIN LOGIN CARD — IMAGE AS BACKGROUND
           ============================================ */
        .login-card{
            position:relative;
            z-index:10;
            width:min(460px,94%);
            border-radius:28px;
            overflow:hidden;
            box-shadow:
                0 30px 100px rgba(0,0,0,.6),
                0 0 80px #19aaff33,
                0 0 1px #19aaff88;
            animation:cardIn .8s cubic-bezier(0.175,0.885,0.32,1.275);
            border:1px solid #19aaff44;
            max-height:96vh;
        }
        @keyframes cardIn{
            from{opacity:0;transform:translateY(40px) scale(.95)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }

        /* الصورة كخلفية للكارت */
        .card-bg{
            position:absolute;
            inset:0;
            background-image:url('bg.png');
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            z-index:0;
            transform:scale(1.05);
            transition:transform 8s ease-in-out;
        }
        .login-card:hover .card-bg{
            transform:scale(1.12);
        }

        /* Overlay داكن فوق الصورة */
        .card-overlay{
            position:absolute;
            inset:0;
            background:linear-gradient(
                135deg,
                rgba(2,8,18,.88) 0%,
                rgba(2,8,18,.75) 50%,
                rgba(2,8,18,.92) 100%
            );
            z-index:1;
            backdrop-filter:blur(2px);
            -webkit-backdrop-filter:blur(2px);
        }

        /* طبقة إضافية للأمان البصري */
        .card-overlay::after{
            content:'';
            position:absolute;
            inset:0;
            background:
                radial-gradient(circle at 30% 20%, #19aaff15, transparent 60%),
                radial-gradient(circle at 70% 80%, #087cff15, transparent 60%);
        }

        /* ============================================
           📦 CONTENT
           ============================================ */
        .card-content{
            position:relative;
            z-index:2;
            padding:36px 30px 28px;
            max-height:96vh;
            overflow-y:auto;
        }
        .card-content::-webkit-scrollbar{width:4px}
        .card-content::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px}
        .card-content::-webkit-scrollbar-track{background:transparent}

        /* ============================================
           🛡️ HEADER
           ============================================ */
        .login-header{text-align:center;margin-bottom:26px}
        .login-logo{
            width:76px;height:76px;
            border-radius:50%;
            border:2px solid var(--accent);
            background:rgba(25,170,255,.15);
            backdrop-filter:blur(10px);
            margin:0 auto 14px;
            display:flex;align-items:center;justify-content:center;
            font-size:38px;
            box-shadow:0 0 40px var(--accent-glow), inset 0 0 20px #19aaff33;
            animation:float 3s ease-in-out infinite;
            position:relative;
        }
        .login-logo::after{
            content:'';
            position:absolute;inset:-8px;
            border-radius:50%;
            border:1px dashed var(--accent);
            opacity:.4;
            animation:spin 14s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

        .login-brand{
            color:var(--accent);
            font-size:13px;font-weight:900;
            letter-spacing:3px;
            margin-bottom:8px;
            text-shadow:0 0 15px var(--accent-glow);
        }
        .login-brand span{color:#fff}

        .login-title{
            color:var(--text-primary);
            font-size:26px;font-weight:900;
            margin-bottom:4px;
            text-shadow:0 2px 15px rgba(0,0,0,.5);
        }
        .login-subtitle{
            color:var(--text-muted);
            font-size:12px;
        }

        /* ============================================
           📝 INPUTS — GLASSMORPHISM
           ============================================ */
        .input-group{
            position:relative;
            margin-bottom:14px;
        }
        .input-group input{
            width:100%;
            padding:15px 48px 15px 18px;
            border:1.5px solid rgba(25,170,255,.35);
            border-radius:14px;
            background:rgba(2,8,18,.55);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            color:var(--text-primary);
            font-size:14px;
            font-family:'Cairo',Arial,sans-serif;
            outline:none;
            transition:all var(--transition);
        }
        .input-group input::placeholder{
            color:var(--text-muted);
            font-weight:400;
        }
        .input-group input:focus{
            border-color:var(--accent);
            background:rgba(2,8,18,.75);
            box-shadow:
                0 0 0 4px #19aaff25,
                0 0 30px #19aaff55,
                inset 0 0 20px #19aaff11;
            transform:translateY(-1px);
        }
        .input-group .input-icon{
            position:absolute;
            left:16px;top:50%;
            transform:translateY(-50%);
            font-size:18px;
            color:var(--text-muted);
            pointer-events:none;
            transition:all var(--transition);
        }
        .input-group input:focus ~ .input-icon{
            color:var(--accent);
            text-shadow:0 0 12px var(--accent-glow);
            transform:translateY(-50%) scale(1.1);
        }
        .input-group .toggle-pw{
            position:absolute;
            left:14px;top:50%;
            transform:translateY(-50%);
            background:none;border:none;
            color:var(--text-muted);
            font-size:16px;
            cursor:pointer;
            padding:6px;
            border-radius:8px;
            transition:all var(--transition);
        }
        .input-group .toggle-pw:hover{color:var(--accent);background:rgba(25,170,255,.1)}

        /* ============================================
           🔘 BUTTONS
           ============================================ */
        .btn{
            width:100%;
            padding:15px 20px;
            border:0;
            border-radius:14px;
            font-family:'Cairo',Arial,sans-serif;
            font-size:15px;
            font-weight:900;
            cursor:pointer;
            transition:all var(--transition);
            position:relative;
            overflow:hidden;
            display:flex;align-items:center;justify-content:center;gap:8px;
            letter-spacing:.5px;
        }
        .btn:disabled{opacity:.6;cursor:not-allowed}

        .btn-primary{
            background:linear-gradient(135deg,var(--accent-dark),var(--accent));
            color:#fff;
            box-shadow:0 8px 30px #087cff66, 0 0 20px #19aaff33;
            margin-top:6px;
        }
        .btn-primary:hover:not(:disabled){
            transform:translateY(-2px);
            box-shadow:0 15px 50px #087cff99, 0 0 40px #19aaff66;
        }
        .btn-primary:active:not(:disabled){transform:translateY(0)}

        .btn .ripple{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,.4);
            transform:scale(0);
            animation:rippleAnim .6s linear;
            pointer-events:none;
        }
        @keyframes rippleAnim{to{transform:scale(4);opacity:0}}

        .btn-success{
            background:linear-gradient(135deg,#128C7E,#25D366);
            color:#fff;
            box-shadow:0 8px 30px #25d36666;
            margin-top:8px;
        }
        .btn-success:hover:not(:disabled){
            transform:translateY(-2px);
            box-shadow:0 15px 45px #25d36699;
        }

        .btn-ghost{
            background:rgba(25,170,255,.08);
            backdrop-filter:blur(10px);
            color:var(--text-secondary);
            border:1.5px solid rgba(25,170,255,.3);
            margin-top:10px;
        }
        .btn-ghost:hover{
            border-color:var(--accent);
            color:var(--accent);
            background:rgba(25,170,255,.15);
            box-shadow:0 0 30px #19aaff44;
        }

        /* ============================================
           🎯 MESSAGES
           ============================================ */
        .msg{
            font-size:13px;
            text-align:center;
            min-height:20px;
            margin-top:10px;
            font-weight:700;
            border-radius:10px;
            padding:0 8px;
            transition:all var(--transition);
        }
        .msg.error{
            color:var(--danger);
            text-shadow:0 0 10px #ff334488;
            animation:shake .4s;
        }
        .msg.success{
            color:var(--success);
            text-shadow:0 0 10px #25d36688;
        }
        @keyframes shake{
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }

        /* ============================================
           🔗 LINKS
           ============================================ */
        .link-row{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:14px;
            font-size:12px;
            flex-wrap:wrap;
            gap:8px;
        }
        .link-row a{
            color:var(--accent);
            text-decoration:none;
            font-weight:700;
            cursor:pointer;
            transition:all var(--transition);
            position:relative;
        }
        .link-row a::after{
            content:'';
            position:absolute;
            bottom:-2px;right:0;
            width:0;height:1px;
            background:var(--accent);
            transition:width var(--transition);
        }
        .link-row a:hover::after{width:100%}
        .link-row a:hover{text-shadow:0 0 12px var(--accent-glow)}

        /* ============================================
           📋 REGISTER FORM
           ============================================ */
        .register-form{
            display:none;
            margin-top:18px;
            padding-top:18px;
            border-top:1px dashed rgba(25,170,255,.3);
            animation:slideDown .4s ease-out;
        }
        .register-form.show{display:block}
        @keyframes slideDown{
            from{opacity:0;transform:translateY(-10px)}
            to{opacity:1;transform:translateY(0)}
        }
        .register-form h3{
            color:var(--accent);
            font-size:15px;
            text-align:center;
            margin-bottom:14px;
            text-shadow:0 0 12px var(--accent-glow);
        }

        /* ============================================
           🌐 SOCIAL — SVG ICONS
           ============================================ */
        .social-section{
            margin-top:20px;
            padding-top:18px;
            border-top:1px solid rgba(25,170,255,.2);
            text-align:center;
        }
        .social-title{
            color:var(--text-muted);
            font-size:10px;
            letter-spacing:3px;
            margin-bottom:14px;
            font-weight:700;
        }
        .social-icons{
            display:flex;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .social-icon{
            width:42px;height:42px;
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            color:#fff;
            text-decoration:none;
            transition:all var(--transition);
            position:relative;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,.3);
        }
        .social-icon svg{
            width:20px;height:20px;
            fill:currentColor;
            position:relative;
            z-index:2;
        }
        .social-icon::before{
            content:'';
            position:absolute;inset:0;
            background:linear-gradient(135deg, rgba(255,255,255,.2), transparent);
            opacity:0;
            transition:opacity var(--transition);
        }
        .social-icon:hover{
            transform:translateY(-5px) scale(1.12);
        }
        .social-icon:hover::before{opacity:1}

        .social-icon.facebook{background:linear-gradient(135deg,#1877f2,#0c5dc7);box-shadow:0 4px 15px #1877f266}
        .social-icon.facebook:hover{box-shadow:0 10px 30px #1877f299}
        .social-icon.instagram{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);box-shadow:0 4px 15px #dc274366}
        .social-icon.instagram:hover{box-shadow:0 10px 30px #dc274399}
        .social-icon.tiktok{background:linear-gradient(135deg,#000,#25f4ee,#fe2c55);box-shadow:0 4px 15px #25f4ee66}
        .social-icon.tiktok:hover{box-shadow:0 10px 30px #fe2c5599}
        .social-icon.telegram{background:linear-gradient(135deg,#0088cc,#006699);box-shadow:0 4px 15px #0088cc66}
        .social-icon.telegram:hover{box-shadow:0 10px 30px #0088cc99}

        /* ============================================
           🦶 FOOTER
           ============================================ */
        .footer{
            text-align:center;
            margin-top:16px;
            padding-top:14px;
            border-top:1px solid rgba(25,170,255,.15);
            color:var(--text-muted);
            font-size:10px;
            line-height:1.9;
        }
        .footer a{
            color:var(--accent);
            text-decoration:none;
            font-weight:700;
            transition:all var(--transition);
        }
        .footer a:hover{text-shadow:0 0 12px var(--accent-glow)}

        /* ============================================
           ⏳ SPINNER
           ============================================ */
        .spinner{
            width:16px;height:16px;
            border:2px solid rgba(255,255,255,.3);
            border-top-color:#fff;
            border-radius:50%;
            animation:spinAnim .8s linear infinite;
            display:inline-block;
        }
        @keyframes spinAnim{to{transform:rotate(360deg)}}

        /* ============================================
           📱 RESPONSIVE
           ============================================ */
        @media (max-width:500px){
            .login-card{
                width:94%;
                border-radius:24px;
                max-height:94vh;
            }
            .card-content{padding:28px 22px 22px}
            .login-logo{width:64px;height:64px;font-size:32px}
            .login-title{font-size:22px}
            .login-brand{font-size:11px;letter-spacing:2px}
            .input-group input{padding:14px 44px 14px 16px;font-size:14px}
            .btn{padding:14px 18px;font-size:14px}
            .social-icon{width:38px;height:38px}
            .social-icon svg{width:18px;height:18px}
        }

        @media (max-width:360px){
            .card-content{padding:22px 16px 18px}
            .login-title{font-size:20px}
        }

        /* ============================================
           🚫 CONTENT PROTECTION
           ============================================ */
        img{
            -webkit-user-drag:none;
            user-drag:none;
            -webkit-touch-callout:none;
            pointer-events:none;
        }
        .card-bg{
            pointer-events:none;
        }

        /* ============================================
           🌞 LIGHT MODE
           ============================================ */
        body.light{--text-muted:#444}
    </style>
</head>
<body>

<!-- Background layers -->
<div class="bg-layer"></div>
<canvas id="matrixCanvas"></canvas>
<div class="particles" id="particles"></div>

<!-- Login Card -->
<div class="login-card">

    <!-- الصورة كخلفية -->
    <div class="card-bg"></div>
    <div class="card-overlay"></div>

    <!-- المحتوى -->
    <div class="card-content">

        <div class="login-header">
            <div class="login-logo">🛡️</div>
            <div class="login-brand">SAYODA <span>|</span> CYBER FORCE</div>
            <div class="login-title">تسجيل الدخول</div>
            <div class="login-subtitle">أهلاً بيك تاني 👋</div>
        </div>

        <!-- Login Form -->
        <div id="loginFormContainer">
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username" maxlength="30">
                <span class="input-icon">👤</span>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" maxlength="50">
                <button type="button" class="toggle-pw" onclick="togglePassword()" title="إظهار/إخفاء">👁️</button>
            </div>

            <button class="btn btn-primary" id="loginBtn" onclick="login(event)">
                <span id="loginBtnText">🚪 دخول</span>
            </button>

            <div class="msg" id="loginMsg"></div>

            <div class="link-row">
                <a onclick="showRegisterForm()">📝 إنشاء حساب جديد</a>
                <a onclick="forgotPassword()">🔑 نسيت كلمة المرور؟</a>
            </div>

            <button class="btn btn-ghost" onclick="guestLogin()">
                👤 دخول كضيف
            </button>
        </div>

        <!-- Register Form -->
        <div class="register-form" id="registerFormContainer">
            <h3>📝 إنشاء حساب جديد</h3>

            <div class="input-group">
                <input type="text" id="regUsername" placeholder="اسم المستخدم" maxlength="30">
                <span class="input-icon">👤</span>
            </div>

            <div class="input-group">
                <input type="password" id="regPassword" placeholder="كلمة المرور" maxlength="50">
                <button type="button" class="toggle-pw" onclick="togglePassword('regPassword')" title="إظهار/إخفاء">👁️</button>
            </div>

            <div class="input-group">
                <input type="tel" id="regPhone" placeholder="رقم الجوال (مثال: 01128351702)" maxlength="11" inputmode="numeric">
                <span class="input-icon">📱</span>
            </div>

            <button class="btn btn-success" id="registerBtn" onclick="submitRegistration(event)">
                <span id="registerBtnText">✅ إنشاء الحساب</span>
            </button>

            <div class="msg" id="registerMsg"></div>

            <div class="link-row" style="justify-content:center">
                <a onclick="hideRegisterForm()">← رجوع لتسجيل الدخول</a>
            </div>
        </div>

        <!-- Social -->
        <div class="social-section">
            <div class="social-title">FOLLOW US</div>
            <div class="social-icons">

                <!-- Facebook -->
                <a href="https://www.facebook.com/share/1EYFi5Aqrk/" target="_blank" rel="noopener" class="social-icon facebook" title="Facebook">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/sayedhassan.2009" target="_blank" rel="noopener" class="social-icon instagram" title="Instagram">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                </a>

                <!-- TikTok -->

/* ============================================
   🛡️ SECURITY: SANITIZE
   ============================================ */
function sanitize(input) {
    if (input === null || input === undefined) return '';
    return String(input)
        .replace(/[<>]/g, '')
        .replace(/[\u0000-\u001F]/g, '')
        .trim();
}

function hasSQLInjection(str) {
    const patterns = [
        /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|EXEC|UNION|SCRIPT)\b)/i,
        /(--|;|\/\*|\*\/|xp_|sp_)/i,
        /('(\s|OR|AND)\s*')/i,
        /(\bOR\b\s+\d+\s*=\s*\d+)/i
    ];
    return patterns.some(p => p.test(str));
}

/* ============================================
   🚫 RATE LIMITING
   ============================================ */
const RATE_LIMIT = {
    maxAttempts: 5,
    windowMs: 60 * 1000,
    key: 'sayoda_login_attempts'
};

function checkRateLimit() {
    try {
        const data = JSON.parse(localStorage.getItem(RATE_LIMIT.key) || '{"count":0,"first":0}');
        const now = Date.now();
        if (now - data.first > RATE_LIMIT.windowMs) {
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify({count:0, first:now}));
            return {ok:true, remaining: RATE_LIMIT.maxAttempts};
        }
        if (data.count >= RATE_LIMIT.maxAttempts) {
            const waitSec = Math.ceil((RATE_LIMIT.windowMs - (now - data.first)) / 1000);
            return {ok:false, remaining:0, waitSec};
        }
        return {ok:true, remaining: RATE_LIMIT.maxAttempts - data.count};
    } catch(e) {
        return {ok:true, remaining: RATE_LIMIT.maxAttempts};
    }
}

function recordAttempt() {
    try {
        const data = JSON.parse(localStorage.getItem(RATE_LIMIT.key) || '{"count":0,"first":0}');
        const now = Date.now();
        if (now - data.first > RATE_LIMIT.windowMs) {
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify({count:1, first:now}));
        } else {
            data.count += 1;
            localStorage.setItem(RATE_LIMIT.key, JSON.stringify(data));
        }
    } catch(e) {}
}

function resetRateLimit() {
    try { localStorage.removeItem(RATE_LIMIT.key); } catch(e) {}
}

function createRipple(e) {
    const btn = e.currentTarget;
    const rect = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
}

document.querySelectorAll('.btn').forEach(btn => {

(function matrixRain() {
    const canvas = document.getElementById('matrixCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, columns, drops;
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ01ABCDEF';
    const fontSize = 16;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        columns = Math.floor(w / fontSize);
        drops = Array(columns).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
        ctx.fillStyle = 'rgba(2,8,18,0.08)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#19aaff';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > h && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(draw, 50);
})();
