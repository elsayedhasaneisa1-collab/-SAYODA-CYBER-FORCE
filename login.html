        /* خلفية متحركة */
        .bg-animation{

        .bg-animation span{
            position:absolute;
            color:#fff;
            font-size:20px;
            font-family:monospace;
            animation:fall linear infinite;
            text-shadow:0 0 10px #19aaff;
        }
        @keyframes fall{
            0%{transform:translateY(-100vh) rotate(0deg);opacity:0}
            10%{opacity:1}
            90%{opacity:1}
            100%{transform:translateY(100vh) rotate(360deg);opacity:0}
        }

        /* الكارت الرئيسي */
        .login-container{
            position:relative;z-index:1;

            overflow:hidden;
            max-height:96vh;
            display:flex;flex-direction:column;
            animation:slideUp .6s ease-out;

        @keyframes slideUp{
            from{opacity:0;transform:translateY(40px)}
            to{opacity:1;transform:translateY(0)}
        }

        /* الجزء العلوي */
        .login-header{
            background:linear-gradient(135deg,#0a1a2e 0%,#087cff 50%,#19aaff 100%);

            background:radial-gradient(circle,#19aaff33,transparent 70%);
            animation:pulse 4s ease-in-out infinite;

        .login-logo{

            border-radius:50%;

            background:rgba(255,255,255,.1);

            box-shadow:0 0 40px #19aaff88;

<script>
    /* ============================================

    const SUPABASE_URL = 'https://brawrhpvtnzvvrzkguic.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q8fBS3nVZqgvfd6diaul8A_cMvHUFtN';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    /* ============================================
       🌌 MATRIX BACKGROUND
       ============================================ */
    (function createMatrix() {
        const container = document.getElementById('bgAnimation');
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        const columns = Math.floor(window.innerWidth / 20);
        for (let i = 0; i < columns; i++) {
            const span = document.createElement('span');
            span.textContent = chars[Math.floor(Math.random() * chars.length)];
            span.style.left = (i * 20) + 'px';
            span.style.animationDuration = (Math.random() * 5 + 5) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(span);
        }
    })();

    /* ============================================
       🛡️ XSS SANITIZE
       ============================================ */
    function sanitizeHTML(text) {
        if (!text) return '';
        const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'};
        return String(text).replace(/[&<>"'/`=]/g, s => map[s]);
    }

    /* ============================================
       🚪 LOGIN
       ============================================ */
    async function login() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const err = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        err.textContent = '';

        if (!u || !p) {
            err.textContent = '⚠️ اكتب اسم المستخدم وكلمة المرور.';
            return;
        }

        btn.disabled = true;
        btn.textContent = '⏳ جاري تسجيل الدخول...';

        try {
            const { data: userData, error } = await sb
                .from('users')
                .select('*')
                .eq('username', u)
                .eq('password', p)
                .maybeSingle();

            if (error) {
                err.textContent = '❌ خطأ في الاتصال بقاعدة البيانات.';
                return;
            }
            if (!userData) {
                err.textContent = '❌ اسم المستخدم أو كلمة المرور غير صحيحة.';
                return;
            }
            if (userData.active === false) {
                err.textContent = '❌ هذا الحساب معطل.';
                return;
            }

            // حفظ بيانات المستخدم مؤقتاً
            sessionStorage.setItem('sayoda_user', JSON.stringify({
                username: u,
                role: userData.role,
                active: userData.active,
                phone: userData.phone
            }));

            // تحديث آخر دخول
            try {
                await sb.rpc('update_last_login', { p_username: u });
            } catch (e) {}

            // تحويل للصفحة الرئيسية
            window.location.href = './index.html';

        } catch (e) {
            err.textContent = '❌ حدث خطأ غير متوقع.';
        } finally {
            btn.disabled = false;
            btn.textContent = '🚪 دخول';
        }
    }

    /* ============================================
       👤 GUEST LOGIN
       ============================================ */
    function guestLogin() {
        sessionStorage.setItem('sayoda_user', JSON.stringify({
            username: 'ضيف',
            role: 'guest',
            isGuest: true
        }));
        window.location.href = './index.html';
    }

    /* ============================================
       📝 REGISTER FORM
       ============================================ */
    function showRegisterForm() {
        document.getElementById('registerFormContainer').style.display = 'block';
        document.getElementById('registerError').textContent = '';
    }

    function hideRegisterForm() {
        document.getElementById('registerFormContainer').style.display = 'none';
        document.getElementById('registerError').textContent = '';
    }

    async function submitRegistration() {
        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value.trim();
        const ph = document.getElementById('regPhone').value.trim();
        const err = document.getElementById('registerError');
        err.style.color = '#ff3344';
        err.textContent = '';

        // التحقق من المدخلات
        if (!u || !p || !ph) { err.textContent = '⚠️ املأ جميع الحقول.'; return; }
        if (u.length < 3) { err.textContent = '⚠️ اسم المستخدم 3 أحرف على الأقل.'; return; }
        if (p.length < 4) { err.textContent = '⚠️ كلمة المرور 4 أحرف على الأقل.'; return; }
        if (!/^[\d]{10,11}$/.test(ph.replace(/\s/g, ''))) { err.textContent = '⚠️ رقم الهاتف غير صحيح (10-11 رقم).'; return; }

        const btn = document.getElementById('registerSubmitBtn');
        btn.disabled = true;
        btn.textContent = '⏳ جاري الإنشاء...';

        try {
            // التحقق من وجود المستخدم
            const { data: existingUser } = await sb.from('users').select('username').eq('username', u).maybeSingle();
            if (existingUser) {
                err.textContent = '⚠️ اسم المستخدم موجود بالفعل!';
                btn.disabled = false;
                btn.textContent = '✅ إنشاء حساب';
                return;
            }

            // إضافة المستخدم الجديد
            const { error: insertError } = await sb.from('users').insert({
                username: u,
                password: p,
                role: 'user',
                active: true,
                phone: ph,
                xp: 0,
                level: 'مبتدئ',
                level_emoji: '🟢',
                streak: 0,
                badges: [],
                videos_watched: [],
                total_rating: 0,
                rating_count: 0,
                videos_locked: true
            });

            if (insertError) throw insertError;

            // إشعار تلجرام
            try {
                await fetch(`https://api.telegram.org/bot8655357261:AAFPVQZEi1F4eqeKRDBDGK-kM9rGXciVqVU/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: '7114350905',
                        text: `🔐 <b>حساب جديد</b>\n👤 ${sanitizeHTML(u)}\n📱 ${sanitizeHTML(ph)}`,
                        parse_mode: 'HTML'
                    })
                });
            } catch (e) {}

            // نجاح
            err.style.color = '#25D366';
            err.textContent = '✅ تم إنشاء حسابك بنجاح! جاري تسجيل الدخول...';

            // تسجيل الدخول تلقائياً
            sessionStorage.setItem('sayoda_user', JSON.stringify({
                username: u,
                role: 'user',
                active: true,
                phone: ph
            }));

            setTimeout(() => {
                window.location.href = './index.html';
            }, 1200);

        } catch (e) {
            console.error(e);
            err.style.color = '#ff3344';
            err.textContent = '❌ حدث خطأ، حاول مرة أخرى.';
            btn.disabled = false;
            btn.textContent = '✅ إنشاء حساب';
        }
    }

    /* ============================================
       ⌨️ ENTER KEY
       ============================================ */
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
    document.getElementById('username').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
    document.getElementById('regPhone').addEventListener('keydown', e => {
        if (e.key === 'Enter') submitRegistration();
    });
</script>

</body>
</html>
